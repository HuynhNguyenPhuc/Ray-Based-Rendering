<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310" font-family="Segoe UI, system-ui, -apple-system, sans-serif" role="img" aria-labelledby="povTitle povDesc">
<title id="povTitle">Perspective versus orthographic projection</title>
<desc id="povDesc">Two equal objects at different depths. With perspective projection the nearer one projects larger; with orthographic projection both project to the same size.</desc>
<defs>
<marker id="povArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#475569"/></marker>
</defs>
<rect x="4" y="4" width="752" height="302" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<line x1="380" y1="24" x2="380" y2="286" stroke="#e2e8f0" stroke-width="1.5"/>

<!-- perspective panel -->
<text x="24" y="34" font-size="16" font-weight="600" fill="#1e293b">Perspective: rays meet at the centre C</text>
<line x1="24" y1="165" x2="360" y2="165" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6 5"/>
<circle cx="40" cy="165" r="5" fill="#1e293b"/>
<text x="26" y="194" font-size="14" fill="#1e293b">C</text>
<line x1="110" y1="95" x2="110" y2="235" stroke="#475569" stroke-width="3"/>
<text x="62" y="86" font-size="14" fill="#475569">image plane</text>
<!-- near object (blue), far object (pink): same size -->
<line x1="200" y1="125" x2="200" y2="205" stroke="#2563eb" stroke-width="5"/>
<line x1="320" y1="125" x2="320" y2="205" stroke="#db2777" stroke-width="5"/>
<text x="178" y="226" font-size="14" fill="#1e3a8a">near</text>
<text x="304" y="226" font-size="14" fill="#9d174d">far</text>
<!-- projecting rays -->
<line x1="40" y1="165" x2="200" y2="125" stroke="#2563eb" stroke-width="1.5"/>
<line x1="40" y1="165" x2="200" y2="205" stroke="#2563eb" stroke-width="1.5"/>
<line x1="40" y1="165" x2="320" y2="125" stroke="#db2777" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="40" y1="165" x2="320" y2="205" stroke="#db2777" stroke-width="1.5" stroke-dasharray="5 4"/>
<!-- projections on the image plane: y = 165 -+ 40*(70/160) = 147.5 .. 182.5 ; far: 165 -+ 40*(70/280) = 155 .. 175 -->
<line x1="104" y1="147.5" x2="104" y2="182.5" stroke="#2563eb" stroke-width="6"/>
<line x1="116" y1="155" x2="116" y2="175" stroke="#db2777" stroke-width="6"/>
<text x="24" y="270" font-size="14" fill="#475569">Same object, farther away: smaller image.</text>

<!-- orthographic panel -->
<text x="404" y="34" font-size="16" font-weight="600" fill="#1e293b">Orthographic: rays are parallel</text>
<line x1="404" y1="165" x2="736" y2="165" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6 5"/>
<line x1="490" y1="95" x2="490" y2="235" stroke="#475569" stroke-width="3"/>
<text x="442" y="86" font-size="14" fill="#475569">image plane</text>
<line x1="580" y1="125" x2="580" y2="205" stroke="#2563eb" stroke-width="5"/>
<line x1="700" y1="125" x2="700" y2="205" stroke="#db2777" stroke-width="5"/>
<text x="558" y="226" font-size="14" fill="#1e3a8a">near</text>
<text x="684" y="226" font-size="14" fill="#9d174d">far</text>
<line x1="580" y1="125" x2="490" y2="125" stroke="#2563eb" stroke-width="1.5" marker-end="url(#povArrow)"/>
<line x1="580" y1="205" x2="490" y2="205" stroke="#2563eb" stroke-width="1.5" marker-end="url(#povArrow)"/>
<line x1="700" y1="125" x2="496" y2="125" stroke="#db2777" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="700" y1="205" x2="496" y2="205" stroke="#db2777" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="484" y1="125" x2="484" y2="205" stroke="#2563eb" stroke-width="6"/>
<line x1="496" y1="125" x2="496" y2="205" stroke="#db2777" stroke-width="6"/>
<text x="404" y="270" font-size="14" fill="#475569">Same object, farther away: same image size.</text>
</svg>
