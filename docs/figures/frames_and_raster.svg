<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" font-family="Segoe UI, system-ui, -apple-system, sans-serif" role="img" aria-labelledby="framesTitle framesDesc">
<title id="framesTitle">Camera frame and raster coordinates</title>
<desc id="framesDesc">Left: the camera frame with x right, y up and z forward. Right: the raster grid with u to the right, v downwards, and the pixel centre at half-integer coordinates.</desc>
<defs>
<marker id="framesArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#475569"/></marker>
<marker id="framesArrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/></marker>
</defs>
<rect x="4" y="4" width="752" height="342" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<line x1="372" y1="24" x2="372" y2="326" stroke="#e2e8f0" stroke-width="1.5"/>

<!-- camera frame -->
<text x="24" y="34" font-size="16" font-weight="600" fill="#1e293b">Camera frame</text>
<circle cx="130" cy="235" r="5" fill="#1e293b"/>
<text x="62" y="262" font-size="14" fill="#1e293b">eye e</text>
<line x1="130" y1="235" x2="270" y2="235" stroke="#2563eb" stroke-width="3" marker-end="url(#framesArrowBlue)"/>
<text x="274" y="240" font-size="15" fill="#1e3a8a">x  (right)</text>
<line x1="130" y1="235" x2="130" y2="95" stroke="#2563eb" stroke-width="3" marker-end="url(#framesArrowBlue)"/>
<text x="140" y="92" font-size="15" fill="#1e3a8a">y  (up)</text>
<line x1="130" y1="235" x2="215" y2="160" stroke="#db2777" stroke-width="3" marker-end="url(#framesArrow)"/>
<text x="224" y="152" font-size="15" fill="#9d174d">z  (forward,</text>
<text x="224" y="170" font-size="15" fill="#9d174d">viewing direction)</text>
<text x="24" y="308" font-size="14" fill="#475569">right × up = −forward: the camera frame is left-handed,</text>
<text x="24" y="326" font-size="14" fill="#475569">the world it sits in is right-handed with +Y up.</text>

<!-- raster -->
<text x="392" y="34" font-size="16" font-weight="600" fill="#1e293b">Raster (film) coordinates</text>
<rect x="440" y="90" width="300" height="200" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<g stroke="#cbd5e1" stroke-width="1">
<line x1="490" y1="90" x2="490" y2="290"/><line x1="540" y1="90" x2="540" y2="290"/><line x1="590" y1="90" x2="590" y2="290"/><line x1="640" y1="90" x2="640" y2="290"/><line x1="690" y1="90" x2="690" y2="290"/>
<line x1="440" y1="140" x2="740" y2="140"/><line x1="440" y1="190" x2="740" y2="190"/><line x1="440" y1="240" x2="740" y2="240"/>
</g>
<!-- pixel (i, j) -->
<rect x="540" y="140" width="50" height="50" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<circle cx="565" cy="165" r="4" fill="#2563eb"/>
<circle cx="554" cy="176" r="4" fill="#db2777"/>
<text x="548" y="130" font-size="14" fill="#1e3a8a">(i, j)</text>
<text x="600" y="164" font-size="14" fill="#1e3a8a">centre</text>
<text x="600" y="182" font-size="14" fill="#1e3a8a">(i+½, j+½)</text>
<text x="600" y="224" font-size="14" fill="#9d174d">jittered sample</text>
<text x="600" y="242" font-size="14" fill="#9d174d">(i+ξ₁, j+ξ₂)</text>
<line x1="559" y1="180" x2="596" y2="220" stroke="#db2777" stroke-width="1.2"/>

<!-- raster axes -->
<line x1="440" y1="74" x2="600" y2="74" stroke="#475569" stroke-width="2" marker-end="url(#framesArrow)"/>
<text x="606" y="79" font-size="15" fill="#475569">u  (right)</text>
<line x1="424" y1="90" x2="424" y2="200" stroke="#475569" stroke-width="2" marker-end="url(#framesArrow)"/>
<text x="400" y="222" font-size="15" fill="#475569">v  (down)</text>
<text x="396" y="104" font-size="14" fill="#475569">(0, 0)</text>
<text x="690" y="308" font-size="14" fill="#475569">(W, H)</text>
<text x="392" y="332" font-size="14" fill="#475569">pixel (i, j) covers [i, i+1) × [j, j+1)</text>
</svg>
