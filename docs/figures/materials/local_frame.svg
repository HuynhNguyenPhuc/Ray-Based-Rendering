<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 410" width="970" height="410" font-family="Segoe UI, system-ui, -apple-system, sans-serif" role="img" aria-labelledby="fr2T fr2D">
<title id="fr2T">The local shading frame</title>
<desc id="fr2D">Directions are expressed in a frame whose +z axis is the outward surface normal; the sign of wo.z says which side the ray is on.</desc>
<defs><marker id="fr2A" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#475569"/></marker></defs>
<rect x="4" y="4" width="962" height="402" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
<rect x="30" y="200" width="560" height="140" fill="#dbeafe" opacity="0.6"/>
<line x1="30" y1="200" x2="590" y2="200" stroke="#1e293b" stroke-width="3"/>
<text x="44" y="224" font-size="14" fill="#1e3a8a" text-anchor="start" font-weight="normal">inside the object (ior)</text>
<text x="44" y="184" font-size="14" fill="#475569" text-anchor="start" font-weight="normal">outside (ior 1)</text>
<line x1="310" y1="200" x2="310" y2="50" stroke="#16a34a" stroke-width="2.5" marker-end="url(#fr2A)"/>
<text x="318" y="62" font-size="14" fill="#166534" text-anchor="start" font-weight="normal">outward normal n  (+z)</text>
<line x1="310" y1="200" x2="195.1" y2="103.6" stroke="#2563eb" stroke-width="2.5" marker-end="url(#fr2A)"/>
<text x="187.09333353215328" y="97.5818585470191" font-size="16" fill="#1e3a8a" text-anchor="end" font-weight="bold">wo</text>
<line x1="310" y1="200" x2="424.9" y2="103.6" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#fr2A)"/>
<text x="432.9066664678467" y="99.5818585470191" font-size="14" fill="#64748b" text-anchor="start" font-weight="normal">reflection</text>
<line x1="310" y1="200" x2="378.9" y2="310.2" stroke="#059669" stroke-width="2.5" marker-end="url(#fr2A)"/>
<text x="386.88950435031666" y="324.24625250033534" font-size="14" fill="#065f46" text-anchor="start" font-weight="normal">wi (refracted)</text>
<text x="44" y="300" font-size="14" fill="#1e3a8a" text-anchor="start" font-weight="bold">wo.z &gt; 0: the ray is outside</text>
<text x="660" y="40" font-size="15" fill="#1e293b" text-anchor="start" font-weight="bold">Same surface, ray coming from inside</text>
<rect x="640" y="200" width="300" height="140" fill="#dbeafe" opacity="0.6"/>
<line x1="640" y1="200" x2="940" y2="200" stroke="#1e293b" stroke-width="3"/>
<line x1="790" y1="200" x2="790" y2="80" stroke="#16a34a" stroke-width="2.5" marker-end="url(#fr2A)"/>
<text x="798" y="100" font-size="14" fill="#166534" text-anchor="start" font-weight="normal">n (still outward)</text>
<line x1="790" y1="200" x2="745" y2="265" stroke="#2563eb" stroke-width="2.5" marker-end="url(#fr2A)"/>
<text x="741" y="281" font-size="16" fill="#1e3a8a" text-anchor="end" font-weight="bold">wo</text>
<text x="655" y="305" font-size="14" fill="#1e3a8a" text-anchor="start" font-weight="bold">wo.z &lt; 0: the ray is inside</text>
<text x="655" y="325" font-size="13" fill="#475569" text-anchor="start" font-weight="normal">so the BSDF refracts outwards (ior → 1)</text>
<text x="30" y="370" font-size="13" fill="#475569" text-anchor="start" font-weight="normal">The BSDF frame is built from the outward normal, never from the normal flipped towards the ray;</text>
<text x="30" y="390" font-size="13" fill="#475569" text-anchor="start" font-weight="normal">otherwise wo.z would always be positive and refraction could not tell entering from leaving.</text>
</svg>
