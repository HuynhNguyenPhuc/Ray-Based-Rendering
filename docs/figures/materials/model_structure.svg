<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" width="900" height="410" font-family="Segoe UI, system-ui, -apple-system, sans-serif" role="img" aria-labelledby="msT msD">
<title id="msT">How the six parameters compose a BSDF</title>
<desc id="msD">Metallic selects conductor or dielectric, Fresnel splits reflection from the body, transmission splits refraction from diffuse.</desc>
<defs><marker id="msA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#475569"/></marker></defs>
<rect x="4" y="4" width="892" height="402" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
<rect x="300" y="20" width="200" height="44" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="400.0" y="47.0" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="bold">light hits the surface</text>
<line x1="360" y1="64" x2="190" y2="110" stroke="#475569" stroke-width="1.8" marker-end="url(#msA)"/>
<text x="235.0" y="83.0" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal">metallic</text>
<line x1="440" y1="64" x2="610" y2="110" stroke="#475569" stroke-width="1.8" marker-end="url(#msA)"/>
<text x="575.0" y="83.0" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal">1 − metallic</text>
<rect x="60" y="110" width="260" height="56" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.8"/>
<text x="190.0" y="135.0" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="bold">Conductor</text>
<text x="190.0" y="153.0" font-size="12" fill="#475569" text-anchor="middle" font-weight="normal">reflects, Fresnel from baseColor (F0)</text>
<rect x="470" y="110" width="300" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="620.0" y="135.0" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="bold">Dielectric interface</text>
<text x="620.0" y="153.0" font-size="12" fill="#475569" text-anchor="middle" font-weight="normal">Fresnel F(ior, angle)</text>
<line x1="570" y1="166" x2="500" y2="220" stroke="#475569" stroke-width="1.8" marker-end="url(#msA)"/>
<text x="521.0" y="189.0" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal">F</text>
<line x1="670" y1="166" x2="700" y2="220" stroke="#475569" stroke-width="1.8" marker-end="url(#msA)"/>
<text x="709.0" y="189.0" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal">1 − F</text>
<rect x="380" y="220" width="220" height="56" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/>
<text x="490.0" y="245.0" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="bold">Specular reflection</text>
<text x="490.0" y="263.0" font-size="12" fill="#475569" text-anchor="middle" font-weight="normal">white, colourless</text>
<rect x="610" y="220" width="200" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="710.0" y="245.0" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="bold">Enters the body</text>
<text x="710.0" y="263.0" font-size="12" fill="#475569" text-anchor="middle" font-weight="normal">tinted by baseColor</text>
<line x1="670" y1="276" x2="600" y2="330" stroke="#475569" stroke-width="1.8" marker-end="url(#msA)"/>
<text x="605.0" y="299.0" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal">transmission</text>
<line x1="750" y1="276" x2="790" y2="330" stroke="#475569" stroke-width="1.8" marker-end="url(#msA)"/>
<text x="806.0" y="299.0" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal">1 − transmission</text>
<rect x="480" y="330" width="220" height="56" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
<text x="590.0" y="355.0" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="bold">Refraction</text>
<text x="590.0" y="373.0" font-size="12" fill="#475569" text-anchor="middle" font-weight="normal">microfacet / specular</text>
<rect x="710" y="330" width="170" height="56" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
<text x="795.0" y="355.0" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="bold">Diffuse</text>
<text x="795.0" y="373.0" font-size="12" fill="#475569" text-anchor="middle" font-weight="normal">Lambertian, baseColor</text>
<rect x="60" y="220" width="280" height="70" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
<text x="200.0" y="252.0" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="bold">roughness</text>
<text x="200.0" y="270.0" font-size="12" fill="#475569" text-anchor="middle" font-weight="normal">0 = delta lobes, > 0 = GGX; α = roughness²</text>
<line x1="200" y1="220" x2="200" y2="166" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="340" y1="255" x2="380" y2="250" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="60" y="330" width="280" height="56" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
<text x="200.0" y="355.0" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="bold">emission</text>
<text x="200.0" y="373.0" font-size="12" fill="#475569" text-anchor="middle" font-weight="normal">added on top, independent of all lobes</text>
</svg>
